# Models/endpoints/prices are replaceable. USD per 1 million tokens.
# Example standard short-context text rates, checked 2026-10-24.
# Verify current rates and model access before a real run.
[experiment]
workers = 3
max_plan_chars = 8000
max_steps = 12
pass_score = 75
noninferiority_margin = 5
timeout_seconds = 180

[models.high]
model = "gpt-6.1-sol"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
input_per_million = 2.0
cached_input_per_million = 0.10
cache_write_per_million = 2.50
output_per_million = 10.0
max_completion_tokens = 6000
reasoning_effort = "medium"

[models.low]
model = "gpt-6-luna"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
input_per_million = 0.10
cached_input_per_million = 0.01
cache_write_per_million = 0.125
output_per_million = 0.50
max_completion_tokens = 6000
reasoning_effort = "medium"

# C uses low for BOTH independent plans and synthesis. No expensive coordinator.
[models.judge]
model = "gpt-6.1-sol"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
input_per_million = 2.0
cached_input_per_million = 0.10
cache_write_per_million = 2.50
output_per_million = 10.0
max_completion_tokens = 6000
reasoning_effort = "medium"
